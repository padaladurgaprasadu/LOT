      model: openai/nvidia/nemotron-3.5-rerank-8b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY_5

# Router & Cooldown Policy
router_settings:
  routing_strategy: usage-based-routing-v2
  cooldown_time: 60
  num_retries: 3
  timeout: 120
  allowed_fails: 2
  fallbacks:
    - kimi-k3.1-pro: ["nemotron-3-ultra-550b", "deepseek-v4-pro"]
    - deepseek-v4-pro: ["deepseek-r1", "llama-3.1-nemotron-ultra-253b"]
    - deepseek-r1: ["deepseek-v4-pro", "llama-3.1-nemotron-ultra-253b"]
    - mistral-large-4-1t: ["kimi-k3.1-pro", "nemotron-3-ultra-550b"]
    - glm-5.3: ["nemotron-3-ultra-550b", "deepseek-v4-pro"]
    - nemotron-3-ultra-550b: ["kimi-k3.1-pro", "deepseek-v4-pro"]
    - llama-3.1-nemotron-ultra-253b: ["deepseek-r1", "nemotron-3-ultra-550b"]

# Redis Cache Integration
cache:
  type: redis
  host: os.environ/REDIS_HOST
  port: os.environ/REDIS_PORT
  ttl: 86400

# General LiteLLM Settings & Hooks
litellm_settings:
  callbacks: ["nim_guardrail_hook.NIMFlagshipGuardrailHook"]
  drop_params: true
  json_logs: true
  set_verbose: false
