# ==============================================================================
# LiteLLM Configuration: 100% Frontier Heavyweight NIM Model Matrix Proxy
# Enforces Zero Lightweight / Edge Quantized / Micro Models (< 250B)
# ==============================================================================

model_list:
  # ----------------------------------------------------------------------------
  # 1. Moonshot Kimi-K3.1-Pro (2.8T) — Daily Chat & Vision Agent
  # ----------------------------------------------------------------------------
  - model_name: kimi-k3.1-pro
    litellm_params:
      model: openai/moonshotai/kimi-k3.1-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY_1
      rpm: 1000
      tpm: 500000
  - model_name: kimi-k3.1-pro
    litellm_params:
      model: openai/moonshotai/kimi-k3.1-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY_2
      rpm: 1000
      tpm: 500000
  - model_name: moonshot/kimi-k3.1-pro
    litellm_params:
